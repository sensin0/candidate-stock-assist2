<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>候補株ランキング</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #111827;
        --muted: #64748b;
        --line: #e2e8f0;
        --good: #047857;
        --warn: #b45309;
        --bad: #be123c;
        --ink: #0f172a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(14px);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .wrap {
        width: min(1120px, calc(100% - 28px));
        margin: 0 auto;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 0;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0;
      }
      .updated {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }
      .report-link {
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 900;
        padding: 8px 10px;
        text-decoration: none;
        white-space: nowrap;
      }
      main {
        padding: 22px 0 40px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .tab {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: #475569;
        cursor: pointer;
        flex: 0 0 auto;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        padding: 9px 12px;
      }
      .tab.active {
        border-color: #172033;
        background: #172033;
        color: white;
      }
      .stat,
      .card,
      .table-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .stat {
        padding: 14px;
      }
      .stat span {
        color: var(--muted);
        display: block;
        font-size: 12px;
        font-weight: 700;
      }
      .stat strong {
        display: block;
        margin-top: 6px;
        font-size: 22px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .section-title {
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
        margin: 18px 0 8px;
      }
      .notice {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffbeb;
        color: #92400e;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 12px;
        padding: 12px 14px;
      }
      .card {
        padding: 14px;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .rank {
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }
      .ticker {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-weight: 900;
      }
      .name {
        margin-top: 4px;
        font-size: 17px;
        font-weight: 900;
      }
      .badge {
        align-self: start;
        border-radius: 999px;
        background: #ecfdf5;
        color: var(--good);
        font-size: 12px;
        font-weight: 900;
        padding: 5px 8px;
        white-space: nowrap;
      }
      .badge.warn {
        background: #fffbeb;
        color: var(--warn);
      }
      .badge.bad {
        background: #fff1f2;
        color: var(--bad);
      }
      .badge.double {
        background: #fdf4ff;
        color: #a21caf;
      }
      .badges {
        align-items: flex-start;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }
      .metric {
        border-radius: 8px;
        background: #f8fafc;
        padding: 9px;
      }
      .metric span {
        color: var(--muted);
        display: block;
        font-size: 11px;
        font-weight: 700;
      }
      .metric strong {
        display: block;
        margin-top: 3px;
        font-size: 13px;
      }
      .plan {
        border-top: 1px solid var(--line);
        color: #334155;
        margin-top: 12px;
        padding-top: 10px;
        font-size: 13px;
        line-height: 1.55;
      }
      .table-panel {
        margin-top: 18px;
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 760px;
        font-size: 13px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 10px;
        text-align: left;
      }
      th {
        background: #f8fafc;
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        border: 1px solid #fecdd3;
        border-radius: 8px;
        background: #fff1f2;
        color: #9f1239;
        padding: 14px;
      }
      @media (max-width: 760px) {
        .top {
          align-items: flex-start;
          flex-direction: column;
        }
        .updated {
          text-align: left;
        }
        .summary,
        .grid {
          grid-template-columns: 1fr;
        }
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap top">
        <div>
          <h1>候補株ランキング</h1>
          <div class="updated" id="subtitle">読み込み中</div>
        </div>
        <a class="report-link" href="./revenue-20-performance.html">20%台検証</a>
        <a class="report-link" href="./earnings-entry-backtest.html">決算後検証</a>
        <a class="report-link" href="./ranking-policy-v11-validation.html">新判定の検証</a>
        <a class="report-link" href="./operating-profit-backtest.html">営業利益反転の検証</a>
        <a class="report-link" href="./forecast-entry-timing.html">決算後の買い時検証</a>
      </div>
    </header>
    <main class="wrap">
      <nav class="tabs" id="tabs" aria-label="ランキング切替"></nav>
      <section class="summary" id="summary"></section>
      <section class="grid" id="cards"></section>
      <section class="table-panel">
        <table>
          <thead id="table-head">
            <tr>
              <th>順位</th>
              <th>銘柄</th>
              <th>総合</th>
              <th>安全</th>
              <th>2倍期待</th>
              <th>売上</th>
              <th>判定</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>
    <script>
      const state = { report: null, tab: "current" };
      const tabs = [
        ["current", "総合"],
        ["validated_a", "検証A"],
        ["profitable_growth", "黒字成長"],
        ["operating_turnaround", "営業黒転"],
        ["operating_v_recovery", "V字回復"],
        ["operating_loss_narrowing", "赤字縮小"],
        ["quarterly_momentum", "四半期モメンタム"],
        ["value_growth", "低評価成長"],
        ["competition", "成績比較"],
      ];
      const yen = (value) => (typeof value === "number" ? `${Math.floor(value).toLocaleString()}円` : "-");
      const millionYen = (value) => (typeof value === "number" ? `${Math.floor(value).toLocaleString()}百万円` : "未取得");
      const pct = (value, digits = 0) => (typeof value === "number" ? `${(value * 100).toFixed(digits)}%` : "-");
      const signed = (value) => (typeof value === "number" ? `${value > 0 ? "+" : ""}${value.toFixed(1)}%` : "-");
      const actionTone = (action = "") => {
        if (action.includes("除外") || action.includes("パス")) return "bad";
        if (action.includes("監視") || action.includes("押し目") || action.includes("確認")) return "warn";
        return "";
      };
      const twoBaggerTag = (item) => {
        const action = item.Action || "";
        const tier = item["Decision Tier"] || "";
        const safety = Number(item["Safety Score"] || 0);
        const potential = Number(item["Two Bagger Score"] || 0);
        if (isPass(item) || tier === "避ける" || tier === "見送り") {
          return `<span class="badge bad">対象外</span>`;
        }
        if (potential >= 70 && safety >= 70 && isBuy(item)) {
          return `<span class="badge double">2倍候補</span>`;
        }
        if (potential >= 45 || action.includes("長期監視")) {
          return `<span class="badge warn">2倍監視</span>`;
        }
        return "";
      };
      const activeRows = () => {
        if (!state.report) return [];
        if (state.tab === "current") return state.report.current_rankings || [];
        return state.report.strategy_rankings?.[state.tab] || [];
      };
      const isPass = (item) =>
        (item.Action || "").includes("パス") ||
        (item.Action || "").includes("Pass") ||
        (item.Action || "").includes("除外") ||
        (item.Action || "").includes("データ再取得待ち") ||
        item["Decision Tier"] === "避ける" ||
        item["Decision Tier"] === "見送り";
      const isBuy = (item) => (item.Action || "").includes("買い候補") || (item.Action || "").includes("BUY");
      const candidateRows = (rows) => rows.filter((item) => !isPass(item));
      const referenceRows = (rows) => rows.filter((item) => isPass(item));
      function renderTabs() {
        document.getElementById("tabs").innerHTML = tabs
          .map(([key, label]) => `<button class="tab ${state.tab === key ? "active" : ""}" data-tab="${key}">${label}</button>`)
          .join("");
        document.querySelectorAll("[data-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            state.tab = button.dataset.tab;
            render();
          });
        });
      }
      function renderCompetition() {
        const rows = state.report?.strategy_competition || [];
        const tested = rows.filter((item) => item.status === "backtested");
        const leader = tested.slice().sort((a, b) => (b.league_score || -999) - (a.league_score || -999))[0];
        document.getElementById("summary").innerHTML = [
          ["参加部門", `${rows.length}部門`],
          ["過去検証済み", `${tested.length}部門`],
          ["現在候補", `${rows.reduce((sum, item) => sum + (item.current_candidates || 0), 0)}件`],
          ["暫定首位", leader?.label || "-"],
          ["実運用", "蓄積中"],
        ].map(([label, value]) => `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`).join("");
        document.getElementById("cards").innerHTML = rows.map((item) => `<article class="card">
          <div class="card-head"><div><div class="name">${item.label}</div><div class="rank">${item.description}</div></div><span class="badge ${item.status === "backtested" ? "" : "warn"}">${item.status === "backtested" ? "過去検証済み" : item.status === "proxy" ? "純利益代理" : "前向き検証中"}</span></div>
          <div class="metrics">
            <div class="metric"><span>リーグ点</span><strong>${item.league_score ?? "蓄積中"}</strong></div>
            <div class="metric"><span>現在候補</span><strong>${item.current_candidates || 0}件</strong></div>
            <div class="metric"><span>1年中央値</span><strong>${typeof item.median_1yr === "number" ? `${item.median_1yr > 0 ? "+" : ""}${item.median_1yr}%` : "蓄積中"}</strong></div>
            <div class="metric"><span>勝率</span><strong>${typeof item.win_rate === "number" ? `${item.win_rate}%` : "-"}</strong></div>
            <div class="metric"><span>市場超え</span><strong>${typeof item.market_beat === "number" ? `${item.market_beat}%` : "-"}</strong></div>
            <div class="metric"><span>-25%到達</span><strong>${typeof item.stop_25 === "number" ? `${item.stop_25}%` : "-"}</strong></div>
            <div class="metric"><span>母数</span><strong>${item.sample || "-"}</strong></div>
          </div>
        </article>`).join("");
        document.getElementById("table-head").innerHTML = `<tr><th>部門</th><th>検証状態</th><th>リーグ点</th><th>候補</th><th>1年中央値</th><th>勝率</th><th>市場超え</th><th>-25%</th></tr>`;
        document.getElementById("rows").innerHTML = rows.map((item) => `<tr><td><strong>${item.label}</strong><br>${item.description}</td><td>${item.status === "backtested" ? "過去検証済み" : item.status === "proxy" ? "純利益代理" : "前向き検証中"}</td><td>${item.league_score ?? "-"}</td><td>${item.current_candidates || 0}</td><td>${item.median_1yr ?? "-"}</td><td>${item.win_rate ?? "-"}</td><td>${item.market_beat ?? "-"}</td><td>${item.stop_25 ?? "-"}</td></tr>`).join("");
      }
      function render() {
        renderTabs();
        if (state.tab === "competition") {
          document.getElementById("subtitle").textContent = `更新: ${state.report?.generated_at_jst || "-"} / 部門別成績比較`;
          renderCompetition();
          return;
        }
        const rows = activeRows();
        const candidates = candidateRows(rows);
        const references = referenceRows(rows);
        const buys = state.tab === "current" ? candidates.filter(isBuy) : candidates;
        const priorityWatch = candidates.filter((item) => item["Decision Tier"] === "監視上位");
        document.getElementById("subtitle").textContent = state.report
          ? `更新: ${state.report.generated_at_jst || "-"} / ${tabs.find(([key]) => key === state.tab)?.[1] || "現行版"}`
          : "読み込み中";
        const top = candidates[0] || rows[0] || {};
        document.getElementById("summary").innerHTML = [
          ["表示銘柄", `${rows.length.toLocaleString()}件`],
          ["候補銘柄", `${candidates.length.toLocaleString()}件`],
          [state.tab === "current" ? "買い候補" : "部門候補", `${buys.length.toLocaleString()}件`],
          ["監視上位", `${priorityWatch.length.toLocaleString()}件`],
          ["トップ", top.Ticker || "-"],
        ]
          .map(([label, value]) => `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`)
          .join("");
        const cardRows = (candidates.length ? candidates : rows)
          .slice(0, 10)
          .map((item) => {
            const tone = actionTone(item.Action);
            const notes = [
              ...(item["Decision Labels"] || []),
              ...(item["Current Version Notes"] || item.Notes || []),
            ].slice(0, 4).join(" / ") || "-";
            const dangers = (item["Danger Notes"] || []).slice(0, 2).join(" / ");
            const strategyReasons = (item["Strategy Reasons"] || []).slice(0, 3).join(" / ");
            const displayScore = item["Strategy Score"] ?? item["Composite Score"] ?? "-";
            return `<article class="card">
              <div class="card-head">
                <div>
                  <div><span class="rank">#${item.Rank}</span> <span class="ticker">${item.Ticker}</span></div>
                  <div class="name">${item.Name || "-"}</div>
                </div>
                <div class="badges"><span class="badge ${tone}">${item.Action || "-"}</span><span class="badge ${tone}">${item["Decision Tier"] || "-"}</span>${twoBaggerTag(item)}</div>
              </div>
              <div class="metrics">
                <div class="metric"><span>上昇期待</span><strong>${item["Expected Upside Score"] ?? "-"}</strong></div>
                <div class="metric"><span>${state.tab === "current" ? "総合" : "部門"}</span><strong>${displayScore}</strong></div>
                <div class="metric"><span>安全</span><strong>${item["Safety Score"] ?? "-"}</strong></div>
                <div class="metric"><span>2倍期待</span><strong>${item["Two Bagger Score"] ?? "-"}</strong></div>
                <div class="metric"><span>売上</span><strong>${signed(item["Revenue Growth"])}</strong></div>
                <div class="metric"><span>年商成長</span><strong>${signed(item["Annual Revenue Growth"])}</strong></div>
                <div class="metric"><span>今期営業</span><strong>${millionYen(item["Current Fiscal Operating Income"] ?? item["Previous Annual Operating Income"])}</strong></div>
                <div class="metric"><span>来期営業予想</span><strong>${millionYen(item["Next Fiscal Operating Income"] ?? item["Forecast Operating Income"])}</strong></div>
                <div class="metric"><span>四半期進捗</span><strong>${signed(item["Operating Forecast Progress"])}</strong></div>
                <div class="metric"><span>時間比ペース</span><strong>${signed(item["Operating Pace Index"])}</strong></div>
                <div class="metric"><span>現在値</span><strong>${yen(item["Current Price"])}</strong></div>
                <div class="metric"><span>+50%</span><strong>${yen(item["Target Price 1"])}</strong></div>
                <div class="metric"><span>+100%</span><strong>${yen(item["Target Price 2"])}</strong></div>
                <div class="metric"><span>撤退</span><strong>${yen(item["Stop Loss"])}</strong></div>
              </div>
              <div class="plan">${item["Sell Plan"] || "+50%で一部利確、+100%で主力利確、-25%で撤退確認"}<br>${item["Operating Pace Status"] && item["Operating Pace Status"] !== "判定対象外" ? `進捗: ${item["Operating Pace Status"]}<br>` : ""}${strategyReasons || notes}${dangers ? `<br>注意: ${dangers}` : ""}</div>
            </article>`;
          })
          .join("");
        const notice = buys.length || state.tab !== "current"
          ? ""
          : `<div class="notice">現在は安全条件を満たす買い候補がありません。無理に買わず、監視上位と長期監視を表示しています。</div>`;
        document.getElementById("cards").innerHTML =
          notice + (candidates.length ? "" : `<div class="error">監視候補も少ないため、参考銘柄を表示しています。</div>`) + cardRows;
        const tableRows = [
          ...(candidates.length ? [{ section: "候補・監視", rows: candidates.slice(0, 50) }] : []),
          { section: "参考・パス", rows: references.slice(0, Math.max(0, 50 - Math.min(candidates.length, 50))) },
        ];
        document.getElementById("table-head").innerHTML = `<tr><th>順位</th><th>銘柄</th><th>上昇期待</th><th>${state.tab === "current" ? "総合" : "部門"}</th><th>安全</th><th>2倍期待</th><th>売上</th><th>判定</th></tr>`;
        document.getElementById("rows").innerHTML = rows
          ? tableRows
              .filter((group) => group.rows.length)
              .map(
                (group) => `
            <tr><td colspan="8" class="section-title">${group.section}</td></tr>
            ${group.rows
              .map(
                (item) => `<tr>
              <td>#${item.Rank}</td>
              <td><strong>${item.Ticker}</strong><br>${item.Name || "-"}</td>
              <td><strong>${item["Expected Upside Score"] ?? "-"}</strong></td>
              <td>${item["Strategy Score"] ?? item["Composite Score"] ?? "-"}</td>
              <td>${item["Safety Score"] ?? "-"}</td>
              <td>${item["Two Bagger Score"] ?? "-"}</td>
              <td>${signed(item["Revenue Growth"])}</td>
              <td>${item.Action || "-"} ${twoBaggerTag(item)}</td>
            </tr>`
              )
              .join("")}`
              )
              .join("")
          : "";
      }
      async function load() {
        try {
          const response = await fetch("weekly_ranking_report.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          state.report = await response.json();
          render();
        } catch (error) {
          document.querySelector("main").innerHTML = `<div class="error">ランキングを読み込めませんでした。GitHub Actionsの更新後にもう一度開いてください。</div>`;
          console.error(error);
        }
      }
      load();
    </script>
  </body>
</html>
